<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MOON EVENT</title>
  <link rel="stylesheet" href="css/styles.css">
 
</head>
<body>
  <section>
    <div class="logo-container">
      <img src="images/MOON LOGO.jpg" alt="Logo Moon" />
      <img src="images/POZ TCHOP LOGO.jpg" alt="Logo Poz Tchop" />
    </div>
    <h1>ENREGISTREMENT</h1>
    <form id="register-form">
      <div class="input-box"><input type="text" name="nom" placeholder="NOM" required /></div>
      <div class="input-box"><input type="text" name="prenom" placeholder="Prénom" required /></div>
      <div class="input-box"><input type="email" name="email" placeholder="Mail" required /></div>
      <div class="input-box"><input type="tel" name="telephone" placeholder="Téléphone" required /></div>
      <button type="submit" class="login-btn">ENREGISTREMENT</button>
    </form>
    <div id="message"></div>
    <div class="text-invite">
      <p>RENDEZ-VOUS CE SAMEDI 03 MAI POUR UN SHOW SPECTACULAIRE !!!</p>
    </div>
  </section>

  <!-- Dépendances -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    emailjs.init("wuZVLZSPmA5k4DDE2");

    document.getElementById("register-form").addEventListener("submit", async function(e) {
      e.preventDefault();

      const form = e.target;
      const nom = form.nom.value.trim();
      const prenom = form.prenom.value.trim();
      const email = form.email.value.trim();
      const tel = form.telephone.value.trim();

      const params = { nom, prenom, email, telephone: tel };
      const messageBox = document.getElementById("message");
      messageBox.innerHTML = "";

      try {
        await emailjs.send("service_4x53erx", "template_9zq8t9i", params);
        messageBox.innerHTML = '<div class="success-msg">Enregistrement réussi ! Téléchargement du ticket...</div>';
        generatePDF(nom);
        form.reset();
      } catch (error) {
        console.error("Erreur EmailJS :", error);
        messageBox.innerHTML = '<div class="error-msg">Erreur lors de l’envoi. Veuillez vérifier votre compte EmailJS.</div>';
      }
    });

    function generatePDF(nom) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({
        orientation: "landscape",
        unit: "mm",
        format: [150, 80]
      });

      // Fond sombre
      doc.setFillColor("#1a1a1a");
      doc.rect(0, 0, 150, 80, "F");

      // Logos organisateurs
      doc.addImage(moonLogoBase64, "jpg", 10, 5, 25, 25);
      doc.addImage(pozTchopLogoBase64, "jpg", 40, 5, 25, 25);

      // Affiche événement
      doc.addImage(afficheBase64, "jpg", 110, 5, 30, 60);

      // Texte
      doc.setTextColor("#FFD700");
      doc.setFontSize(14);
      doc.text(`TICKET INVITATION`, 10, 38);

      doc.setTextColor("#ffffff");
      doc.setFontSize(10);
      doc.text(`Nom: ${nom}`, 10, 48);
      doc.text(`Évènement: Chill Street`, 10, 54);
      doc.text(`Date: Samedi 03 Mai 2025`, 10, 60);
      doc.text(`Lieu: SNI OWENDO`, 10, 66);
      doc.setFontSize(8);
      doc.text("Entrée gratuite | Show: Alu'man + artistes du label", 10, 72);

      doc.save(`ticket_${nom}.pdf`);
    }
